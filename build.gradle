import compiler.NativeImageTask

buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    constraints {
      classpath('org.eclipse.jgit:org.eclipse.jgit:6.10.1.202505221210-r') {
        because 'mitigate JGit CVEs while staying on pure-Java JGit (no git CLI in graalvm-dev)'
      }
      classpath('com.google.guava:guava:33.8.0-jre') {
        because 'mitigate Guava CVEs pulled by git-version 1.0.0'
      }
    }
  }
}

plugins {
  id 'compiler.native-image'
  id 'compiler.scala-cli'
  id 'com.gradleup.shadow' version '9.6.1'
  id 'com.palantir.git-version' version '1.0.0'
}

apply plugin: 'scala'
apply plugin: 'application'

repositories {
    mavenCentral()
}

configurations {
    replCompiler
}

ext {
    scala_maj = '3'
    scala_ver = "${scala_maj}.10.1"

    pekko_core = '2.0.0'
    pekko_http = '2.0.0'
    scala_test = '3.2.20'
}

dependencies {
    implementation "org.scala-lang:scala${scala_maj}-library_${scala_maj}:${scala_ver}"
    replCompiler "org.scala-lang:scala${scala_maj}-compiler_${scala_maj}:${scala_ver}"

    implementation 'org.slf4j:slf4j-simple:2.0.20'

    implementation "org.apache.pekko:pekko-actor-typed_${scala_maj}:${pekko_core}"
    implementation "org.apache.pekko:pekko-slf4j_${scala_maj}:${pekko_core}"
    implementation "org.apache.pekko:pekko-stream_${scala_maj}:${pekko_core}"
    implementation "org.apache.pekko:pekko-http_${scala_maj}:${pekko_http}"
    implementation "org.apache.pekko:pekko-http-spray-json_${scala_maj}:${pekko_http}"

    implementation "org.scala-lang.modules:scala-xml_${scala_maj}:2.5.0"

    implementation "org.parboiled:parboiled_${scala_maj}:2.5.1"

    testImplementation "org.scalatest:scalatest_${scala_maj}:${scala_test}"
    testImplementation "org.scalactic:scalactic_${scala_maj}:${scala_test}"

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.scalatestplus:junit-4-13_${scala_maj}:${scala_test}.0"

    testImplementation "org.apache.pekko:pekko-actor-testkit-typed_${scala_maj}:${pekko_core}"
    testImplementation "org.apache.pekko:pekko-stream-testkit_${scala_maj}:${pekko_core}"
    testImplementation "org.apache.pekko:pekko-http-testkit_${scala_maj}:${pekko_http}"
}

def testReportsEnabled = providers.gradleProperty('testReports')
    .map { it.toBoolean() }
    .getOrElse(false)

test {
  useJUnit()
  maxParallelForks = Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))
  jvmArgs '--sun-misc-unsafe-memory-access=allow', '-XX:+UseCompactObjectHeaders'
  reports {
    html.required = testReportsEnabled
    junitXml.required = testReportsEnabled
  }
  testLogging {
    events "passed", "skipped", "failed"
    showStandardStreams = false
    exceptionFormat = 'full'
  }
  addTestListener(new org.gradle.api.tasks.testing.TestListener() {
    @Override void beforeSuite(org.gradle.api.tasks.testing.TestDescriptor suite) {}
    @Override void beforeTest(org.gradle.api.tasks.testing.TestDescriptor testDescriptor) {}
    @Override void afterTest(org.gradle.api.tasks.testing.TestDescriptor testDescriptor, org.gradle.api.tasks.testing.TestResult result) {}
    @Override void afterSuite(org.gradle.api.tasks.testing.TestDescriptor desc, org.gradle.api.tasks.testing.TestResult result) {
      if (desc.parent == null) {
        println "\nTest result: ${result.resultType}"
        println "Tests: ${result.testCount}, succeeded: ${result.successfulTestCount}, failed: ${result.failedTestCount}, skipped: ${result.skippedTestCount}"
        println "Time: ${(result.endTime - result.startTime) / 1000.0} s"
      }
    }
  })
}

def skipGitVersion = providers.gradleProperty('skipGitVersion')
    .map { it.toBoolean() }
    .getOrElse(false)

version = skipGitVersion ? 'warmup' : gitVersion()

def resolvedProjectVersion = version.toString()

def requireCleanVersion = providers.gradleProperty('requireCleanVersion')
    .map { it.toBoolean() }
    .getOrElse(false)

def singleShotCompile = providers.gradleProperty('singleShotCompile')
    .map { it.toBoolean() }
    .getOrElse(false)

def includeTestDeps = providers.gradleProperty('includeTestDeps')
    .map { it.toBoolean() }
    .getOrElse(false)

tasks.register('warmDependencyCache') {
    group = 'build setup'
    description = 'Resolves compile, runtime, and Scala/Zinc compiler dependencies to warm local/container caches without writing build artifacts'
    def confsToResolve = [
        configurations.compileClasspath,
        configurations.runtimeClasspath,
        configurations.named('zinc').get(),
        configurations.named('scalaCompilerPlugins').get()
    ] + (includeTestDeps ? [configurations.testCompileClasspath, configurations.testRuntimeClasspath] : [])
    def compileScalaTask = tasks.named('compileScala', org.gradle.api.tasks.scala.ScalaCompile)
    def compilerClasspaths = [
        scalaClasspath: compileScalaTask.map { it.scalaClasspath },
        zincClasspath: compileScalaTask.map { it.zincClasspath }
    ]
    doLast {
        int totalFiles = 0
        confsToResolve.each { conf ->
            def resolved = conf.resolve()
            totalFiles += resolved.size()
            logger.info("[deps] warmed configuration={} files={}", conf.name, resolved.size())
        }
        compilerClasspaths.each { name, cpProvider ->
            def files = cpProvider.get().files
            totalFiles += files.size()
            logger.info("[deps] warmed {} files={}", name, files.size())
        }
        logger.lifecycle("[deps] warmed {} configurations + {} compiler classpaths ({} artifact files)", confsToResolve.size(), compilerClasspaths.size(), totalFiles)
    }
}

tasks.register('verifyCleanVersion') {
    group = 'verification'
    description = 'Verifies that the resolved git version does not have a .dirty suffix'
    def versionToCheck = resolvedProjectVersion
    def repoDir = project.projectDir
    def buildscriptClassLoader = project.buildscript.classLoader
    doLast {
        if (versionToCheck == 'warmup' || versionToCheck == 'unspecified' || versionToCheck.endsWith('.dirty')) {
            def details = []
            try {
                def gitClass = buildscriptClassLoader.loadClass('org.eclipse.jgit.api.Git')
                def git = gitClass.open(repoDir)
                try {
                    def status = git.status().call()
                    [
                      added: status.getAdded(),
                      changed: status.getChanged(),
                      modified: status.getModified(),
                      missing: status.getMissing(),
                      removed: status.getRemoved(),
                      untracked: status.getUntracked(),
                      conflicting: status.getConflicting()
                    ].each { label, paths ->
                        if (paths && !paths.isEmpty()) {
                            def sample = paths.sort(false).take(20)
                            def suffix = paths.size() > 20 ? " (+${paths.size() - 20} more)" : ''
                            details << "${label}(${paths.size()}): ${sample.join(', ')}${suffix}"
                        }
                    }
                } finally {
                    git.close()
                }
            } catch (Exception e) {
                details << "unable to inspect JGit status: ${e.message}"
            }
            def detailMsg = details.isEmpty() ? '' : "\nDirty paths:\n  - ${details.join('\n  - ')}"
            logger.error("[version] dirty build version detected: {}{}", versionToCheck, detailMsg)
            throw new GradleException("Project version '${versionToCheck}' is dirty. Commit, remove, or ignore pending changes before building a clean artifact.${detailMsg}")
        }
        logger.lifecycle("[version] verified clean version={}", versionToCheck)
    }
}

application {
    mainClass.set('app.tablo2hdhomerunApp')
    applicationDefaultJvmArgs = [
      '--sun-misc-unsafe-memory-access=allow',
      '-XX:+UseCompactObjectHeaders',
      '-XX:+UseSerialGC',
      '-Xms32m',
      '-Xmx128m',
      '-XX:MaxNewSize=64m'
    ]
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE // allow duplicates
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
        }
        resources {
            srcDir 'src/main/resources'
                exclude '**/*.sample'
        }
    }
}

tasks.register('repl', JavaExec) {
    mainClass = 'scala.tools.nsc.MainGenericRunner'
    classpath = sourceSets.main.runtimeClasspath + configurations.replCompiler
    standardInput = System.in
    args '-usejavacp'
}

def generatedResourcesDir = layout.buildDirectory.dir('generated-resources')

tasks.register('mergeReferenceConf') {
    description = 'Merges all reference.conf files from Pekko dependencies'
    def pekkoJars = configurations.runtimeClasspath.elements.map { files ->
        files.collect { it.asFile }.findAll { it.name.contains('pekko') }
    }
    def versionString = resolvedProjectVersion
    inputs.files(pekkoJars).withPathSensitivity(PathSensitivity.NAME_ONLY)
    inputs.property('projectVersion', versionString)
    outputs.dir(generatedResourcesDir)

    doLast {
        def outputDir = generatedResourcesDir.get().asFile
        outputDir.mkdirs()

        def referenceConf = new StringBuilder()
        def versionConf = new StringBuilder()

        pekkoJars.get().each { jar ->
            new java.util.zip.ZipFile(jar).withCloseable { zipFile ->
                def refEntry = zipFile.getEntry('reference.conf')
                if (refEntry) {
                    referenceConf.append(zipFile.getInputStream(refEntry).text)
                    referenceConf.append('\n')
                }
                def verEntry = zipFile.getEntry('version.conf')
                if (verEntry) {
                    versionConf.append(zipFile.getInputStream(verEntry).text)
                    versionConf.append('\n')
                }
            }
        }

        def writeIfChanged = { File target, String content ->
            if (!target.exists() || target.text != content) {
                target.text = content
            }
        }

        writeIfChanged(new File(outputDir, 'reference.conf'), referenceConf.toString())
        writeIfChanged(new File(outputDir, 'version.conf'), versionConf.toString())
        writeIfChanged(new File(outputDir, 'version.properties'), "version=${versionString}\n")
    }
}

sourceSets.main.resources.srcDir(tasks.named('mergeReferenceConf'))

jar {
    archiveClassifier = 'plain'
    manifest {
        attributes(
          'App-Version': resolvedProjectVersion,
          'Implementation-Version': resolvedProjectVersion
        )
    }
}

shadowJar {
    archiveClassifier = ''
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    exclude '**/*.tasty', '**/*.proto', '**/*.protobuf', 'META-INF/maven/**'
    manifest {
        attributes(
          'App-Version': resolvedProjectVersion,
          'Implementation-Version': resolvedProjectVersion
        )
    }
    mergeServiceFiles()
    def jarVersion = resolvedProjectVersion
    doFirst {
        if (jarVersion.endsWith('.dirty')) {
            logger.warn("[version] packaging dirty shadowJar version={} (run 'gradle verifyCleanVersion' to inspect dirty paths)", jarVersion)
        } else {
            logger.info("[version] packaging clean shadowJar version={}", jarVersion)
        }
    }
}

nativeImage {
    inputJar.set(tasks.named('shadowJar').flatMap { it.archiveFile })
    outputBinary.set(layout.buildDirectory.file(project.name))

    minHeap = 32
    maxHeap = 128
    maxNew = 64

    parameters = [
      NativeImageTask.Option.STATIC
    , NativeImageTask.Option.MUSL
    , NativeImageTask.Option.CPU
    ]
}

if (requireCleanVersion) {
    tasks.named('mergeReferenceConf') { dependsOn tasks.named('verifyCleanVersion') }
    tasks.named('jar') { dependsOn tasks.named('verifyCleanVersion') }
    tasks.named('shadowJar') { dependsOn tasks.named('verifyCleanVersion') }
    tasks.named('nativeImage') { dependsOn tasks.named('verifyCleanVersion') }
}

scalaCli {
    dependsOn clean

    minHeap = 1
    maxHeap = 8
}

def javaOutputVersion = {
  def v = JavaVersion.current()
  if (v.isCompatibleWith(JavaVersion.VERSION_25)) return 25
  if (v.isCompatibleWith(JavaVersion.VERSION_21)) return 21
  if (v.isCompatibleWith(JavaVersion.VERSION_17)) return 17
  if (v.isCompatibleWith(JavaVersion.VERSION_11)) return 11
  return 11
}()

def scalaBackendParallelism = Math.max(1, Math.min(Runtime.runtime.availableProcessors(), 8))

def scalaCompilerParams = [
    '-feature'
  , '-no-indent'
  , '-explain'
  , '-language:noAutoTupling'
  , '-Werror'
  , '-Wnonunit-statement'
  , '-Wsafe-init'
  , '-Wunused:all'
  , '-Wvalue-discard'
  , "-Ybackend-parallelism:${scalaBackendParallelism}".toString()
  , "-Xunchecked-java-output-version:${javaOutputVersion}".toString()
]

def scalaForkJvmArgs = [
    '-XX:+UseParallelGC'
  , '-XX:+UseCompactObjectHeaders'
  , '--sun-misc-unsafe-memory-access=allow'
] + (singleShotCompile ? ['-XX:TieredStopAtLevel=1'] : [])

tasks.withType(org.gradle.api.tasks.scala.ScalaCompile).configureEach {
  scalaCompileOptions.deprecation = true
  scalaCompileOptions.additionalParameters = scalaCompilerParams
  scalaCompileOptions.forkOptions.memoryInitialSize = '256m'
  scalaCompileOptions.forkOptions.memoryMaximumSize = '2g'
  scalaCompileOptions.forkOptions.jvmArgs = scalaForkJvmArgs
}
tasks.named('compileTestScala').configure {
  def testParams = scalaCompilerParams.collect { it == '-Werror' ? '-Wconf:any:w' : it }
  scalaCompileOptions.additionalParameters = testParams
}
