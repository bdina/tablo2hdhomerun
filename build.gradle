import compiler.NativeImageTask

plugins {
  id 'compiler.native-image'
  id 'compiler.scala-cli'
  id 'com.gradleup.shadow' version '9.6.1'
  id 'com.palantir.git-version' version '1.0.0'
}

apply plugin: 'scala'
apply plugin: 'application'

repositories {
    flatDir {
        dirs 'lib'
    }
    mavenCentral()
    maven {
        url = 'https://mvnrepository.com/artifact'
    }
}

ext {
    scala_maj = '3'
    scala_ver = "${scala_maj}.9.0"

    pekko_core = '1.7.0'
    pekko_http = '1.4.0'
    scala_test = '3.2.20'
}

dependencies {
    implementation "org.scala-lang:scala${scala_maj}-library_${scala_maj}:${scala_ver}"
    implementation "org.scala-lang:scala${scala_maj}-compiler_${scala_maj}:${scala_ver}"

    implementation 'org.slf4j:slf4j-simple:2.0.19'

    implementation "org.apache.pekko:pekko-actor-typed_${scala_maj}:${pekko_core}"
    implementation "org.apache.pekko:pekko-slf4j_${scala_maj}:${pekko_core}"
    implementation "org.apache.pekko:pekko-stream_${scala_maj}:${pekko_core}"
    implementation "org.apache.pekko:pekko-http_${scala_maj}:${pekko_http}"
    implementation "org.apache.pekko:pekko-http-spray-json_${scala_maj}:${pekko_http}"

    implementation "org.scala-lang.modules:scala-xml_${scala_maj}:2.5.0"

    implementation "org.parboiled:parboiled_${scala_maj}:2.5.1"

    testImplementation "org.scalatest:scalatest_${scala_maj}:${scala_test}"
    testImplementation "org.scalactic:scalactic_${scala_maj}:${scala_test}"

    testImplementation 'junit:junit:4.13.2'
    testImplementation "org.scalatestplus:junit-4-13_${scala_maj}:${scala_test}.0"

    testImplementation "org.apache.pekko:pekko-actor-testkit-typed_${scala_maj}:${pekko_core}"
    testImplementation "org.apache.pekko:pekko-stream-testkit_${scala_maj}:${pekko_core}"
    testImplementation "org.apache.pekko:pekko-http-testkit_${scala_maj}:${pekko_http}"
}

test {
  useJUnit()
  testLogging {
    events "passed", "skipped", "failed"
    showStandardStreams = false
    exceptionFormat = 'full'
  }
  afterSuite { desc, result ->
    if (desc.parent == null) {
      println "\nTest result: ${result.resultType}"
      println "Tests: ${result.testCount}, succeeded: ${result.successfulTestCount}, failed: ${result.failedTestCount}, skipped: ${result.skippedTestCount}"
      println "Time: ${(result.endTime - result.startTime) / 1000.0} s"
    }
  }
}

version = gitVersion()

application {
    mainClass.set('app.tablo2hdhomerunApp')
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE // allow duplicates
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
        }
        resources {
            srcDir 'src/main/resources'
                exclude '**/*.sample'
        }
    }
}

task repl(type:JavaExec) {
    mainClass = 'scala.tools.nsc.MainGenericRunner'
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    args '-usejavacp'
}

task mergeReferenceConf {
    description = 'Merges all reference.conf files from Pekko dependencies'
    doLast {
        def outputDir = file("${buildDir}/generated-resources")
        outputDir.mkdirs()

        def referenceConf = new StringBuilder()
        def versionConf = new StringBuilder()

        configurations.runtimeClasspath.each { jar ->
            if (jar.name.contains('pekko')) {
                def zipFile = new java.util.zip.ZipFile(jar)
                try {
                    def refEntry = zipFile.getEntry('reference.conf')
                    if (refEntry) {
                        referenceConf.append(zipFile.getInputStream(refEntry).text)
                        referenceConf.append('\n')
                    }
                    def verEntry = zipFile.getEntry('version.conf')
                    if (verEntry) {
                        versionConf.append(zipFile.getInputStream(verEntry).text)
                        versionConf.append('\n')
                    }
                } finally {
                    zipFile.close()
                }
            }
        }

        file("${outputDir}/reference.conf").text = referenceConf.toString()
        file("${outputDir}/version.conf").text = versionConf.toString()
    }
}

sourceSets.main.resources.srcDirs += "${buildDir}/generated-resources"

processResources.dependsOn mergeReferenceConf

jar {
    archiveClassifier = 'plain'
}

shadowJar {
    archiveClassifier = ''
    manifest {
        attributes 'App-Version': gitVersion()
    }
    mergeServiceFiles()
}

nativeImage {
    dependsOn shadowJar

    minHeap = 128
    maxHeap = 128
    maxNew = 64

    parameters = [
      NativeImageTask.Option.STATIC
    , NativeImageTask.Option.MUSL
    , NativeImageTask.Option.CPU
    ]
}

scalaCli {
    dependsOn clean

    minHeap = 1
    maxHeap = 8
}

def javaOutputVersion = {
  def v = JavaVersion.current()
  if (v.isCompatibleWith(JavaVersion.VERSION_17)) return 17
  if (v.isCompatibleWith(JavaVersion.VERSION_11)) return 11
  return 11
}()

def scalaCompilerParams = [
    '-feature'
  , '-no-indent'
  , '-explain'
  , '-language:noAutoTupling'
  , '-Werror'
  , '-Wconf:msg=Implicit parameters should be provided with a `using` clause:s'
  , '-Wnonunit-statement'
  , '-Wsafe-init'
  , '-Wunused:all'
  , '-Wvalue-discard'
  , "-Xunchecked-java-output-version:${javaOutputVersion}".toString()
]

tasks.withType(org.gradle.api.tasks.scala.ScalaCompile).configureEach {
  scalaCompileOptions.deprecation = true
  scalaCompileOptions.additionalParameters = scalaCompilerParams
}
tasks.named('compileTestScala').configure {
  def testParams = scalaCompilerParams.collect { it == '-Werror' ? '-Wconf:any:w' : it }
  scalaCompileOptions.additionalParameters = testParams
}
